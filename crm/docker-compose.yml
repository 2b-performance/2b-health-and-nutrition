# Sobe o CRM + Postgres para produção/homologação local.
# Uso: defina AUTH_SECRET no ambiente e rode `docker compose up --build`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://crm:crm@db:5432/crm?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:?defina AUTH_SECRET no ambiente}"
      NODE_ENV: production
      TZ: America/Sao_Paulo
    ports:
      - "3000:3000"

volumes:
  pgdata:
