# Configuração Fly.io. Troque "app" por um nome único antes do primeiro deploy
# (ou deixe o `fly launch` gerar). O volume "escala_data" guarda o SQLite.
app = "escala-oficiais-4gbm"
primary_region = "gru"   # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DB_PATH = "/data/escala.db"

[[mounts]]
  source = "escala_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
